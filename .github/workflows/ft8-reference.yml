name: FT8 Reference

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ft8-reference:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MiniShell
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether FT8 reference tests apply
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            range="origin/${{ github.base_ref }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == "0000000000000000000000000000000000000000" ]]; then
              range="HEAD^...HEAD"
            else
              range="$before...HEAD"
            fi
          fi

          git diff --name-only "$range" > changed-files.txt
          echo "Changed files:"
          cat changed-files.txt

          run_reference=false

          while IFS= read -r path; do
            case "$path" in
              apps/ft8/src/ft8_engine/*|\
              apps/ft8/src/rx_audio_adapter/*|\
              apps/ft8/src/rx_frontend/*|\
              apps/ft8/src/rx_slot_framer/*|\
              apps/ft8/src/rx_result_builder/*|\
              tests/ft8_*reference.c|\
              tests/rx_*|\
              tests/apps/ft8_rx_probe.c|\
              tests/linux_ft8_rx7.py|\
              .github/workflows/ft8-reference.yml|\
              CMakeLists.txt)
                run_reference=true
                ;;
              apps/ft8/src/app_controller/app_controller.c|\
              apps/ft8/src/app_controller/app_controller.h|\
              apps/ft8/main/ft8_main.c)
                if git diff -U0 "$range" -- "$path" | \
                   grep -Eq '^[+-].*(AppRxState|app_controller_start_rx|app_controller_step_rx|rx_emit_event|ft8_engine_|rx_audio_adapter_|rx_frontend_|rx_slot_framer_|rx_result_builder_|--rx)'; then
                  run_reference=true
                fi
                ;;
            esac
          done < changed-files.txt

          echo "run_reference=$run_reference" >> "$GITHUB_OUTPUT"
          echo "FT8 reference tests: $run_reference"

      - name: Skip note
        if: steps.gate.outputs.run_reference != 'true'
        run: echo "FT8 reference-sensitive code did not change; golden suite skipped."

      - name: Checkout pinned MiniFT8-V2 reference
        if: steps.gate.outputs.run_reference == 'true'
        uses: actions/checkout@v4
        with:
          repository: wcheng95/Mini-FT8
          ref: 5bd3ef98f72388a850bebad04bd7300b90edb63c
          path: reference/Mini-FT8

      - name: Configure consolidated reference build
        if: steps.gate.outputs.run_reference == 'true'
        shell: bash
        run: |
          WAV="$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
          cmake -S . -B build-ft8-reference \
            -DFT8_RX1C_REFERENCE_WAV="$WAV" \
            -DFT8_RX1D_REFERENCE_WAV="$WAV" \
            -DFT8_RX1G_REFERENCE_WAV="$WAV"

      - name: Build shared reference targets
        if: steps.gate.outputs.run_reference == 'true'
        run: |
          cmake --build build-ft8-reference -j2 --target \
            minishell ft8 ft8_ui_smoke ft8_decode \
            ft8_monitor_rx1c_unit ft8_monitor_rx1c_reference \
            ft8_decoder_rx1d_unit ft8_decoder_rx1d_reference \
            ft8_engine_rx1g_unit ft8_engine_rx1g_reference \
            ft8_protocol_core ft8_hash_store_core ft8_monitor_core ft8_decoder_core ft8_engine_core

      - name: Run RX-1C RX-1D RX-1G CTest references
        if: steps.gate.outputs.run_reference == 'true'
        run: >-
          ctest --test-dir build-ft8-reference
          -R '^(ft8_monitor_rx1c|ft8_decoder_rx1d|ft8_engine_rx1g)'
          --output-on-failure

      - name: Run RX-2 host decoder reference
        if: steps.gate.outputs.run_reference == 'true'
        shell: bash
        run: |
          WAV="$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
          OUTPUT="$(./build-ft8-reference/ft8_decode "$WAV")"
          printf '%s\n' "$OUTPUT"
          test "$OUTPUT" = "CQ W1XYZ FN42"

      - name: Build and run RX-3 frontend references
        if: steps.gate.outputs.run_reference == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          B=build-ft8-reference
          WAV="$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/rx_frontend \
            tests/rx_frontend_rx3_test.c \
            apps/ft8/src/rx_frontend/rx_frontend.c \
            -o "$B/rx_frontend_rx3_unit"
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/rx_frontend -Iapps/ft8/src/ft8_engine \
            tests/rx_frontend_rx3_reference.c \
            apps/ft8/src/rx_frontend/rx_frontend.c \
            "$B/libft8_engine_core.a" "$B/libft8_monitor_core.a" \
            "$B/libft8_decoder_core.a" "$B/libft8_protocol_core.a" \
            "$B/libft8_hash_store_core.a" -lm \
            -o "$B/rx_frontend_rx3_reference"
          "$B/rx_frontend_rx3_unit"
          "$B/rx_frontend_rx3_reference" "$WAV"

      - name: Build and run RX-4 slot-framer references
        if: steps.gate.outputs.run_reference == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          B=build-ft8-reference
          WAV="$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/rx_slot_framer \
            tests/rx_slot_framer_rx4_test.c \
            apps/ft8/src/rx_slot_framer/rx_slot_framer.c \
            -o "$B/rx_slot_framer_rx4_unit"
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/rx_slot_framer -Iapps/ft8/src/ft8_engine \
            tests/rx_slot_framer_rx4_reference.c \
            apps/ft8/src/rx_slot_framer/rx_slot_framer.c \
            "$B/libft8_engine_core.a" "$B/libft8_monitor_core.a" \
            "$B/libft8_decoder_core.a" "$B/libft8_protocol_core.a" \
            "$B/libft8_hash_store_core.a" -lm \
            -o "$B/rx_slot_framer_rx4_reference"
          "$B/rx_slot_framer_rx4_unit"
          "$B/rx_slot_framer_rx4_reference" "$WAV"

      - name: Build and run RX-5 assembly references
        if: steps.gate.outputs.run_reference == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          B=build-ft8-reference
          WAV="$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/ft8_engine -Iapps/ft8/src/rx_result_builder \
            tests/rx_result_builder_rx5_test.c \
            apps/ft8/src/rx_result_builder/rx_result_builder.c \
            "$B/libft8_protocol_core.a" "$B/libft8_hash_store_core.a" \
            -o "$B/rx_result_builder_rx5_unit"
          cc -std=c11 -D_POSIX_C_SOURCE=200112L -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/ft8_engine -Iapps/ft8/src/rx_frontend \
            -Iapps/ft8/src/rx_slot_framer -Iapps/ft8/src/rx_result_builder \
            tests/rx5_pure_assembly_reference.c \
            apps/ft8/src/rx_frontend/rx_frontend.c \
            apps/ft8/src/rx_slot_framer/rx_slot_framer.c \
            apps/ft8/src/rx_result_builder/rx_result_builder.c \
            "$B/libft8_engine_core.a" "$B/libft8_monitor_core.a" \
            "$B/libft8_decoder_core.a" "$B/libft8_protocol_core.a" \
            "$B/libft8_hash_store_core.a" -lm \
            -o "$B/rx5_pure_assembly_reference"
          "$B/rx_result_builder_rx5_unit"
          "$B/rx5_pure_assembly_reference" "$WAV"

      - name: Build and run RX-6 MiniShell Audio reference
        if: steps.gate.outputs.run_reference == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          B=build-ft8-reference
          mkdir -p "$B/test-apps" rx6-root/flash
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic \
            -Iinclude -Iapps/ft8/src/rx_audio_adapter \
            tests/rx_audio_adapter_rx6_test.c \
            apps/ft8/src/rx_audio_adapter/rx_audio_adapter.c \
            -o "$B/rx_audio_adapter_rx6_unit"
          "$B/rx_audio_adapter_rx6_unit"
          cc -std=c11 -fPIC -shared -Wall -Wextra -Werror -Wpedantic \
            -Iinclude -Iapps/ft8/src/ft8_engine \
            -Iapps/ft8/src/ft8_engine/vendor/kissfft \
            -Iapps/ft8/src/rx_audio_adapter -Iapps/ft8/src/rx_frontend \
            -Iapps/ft8/src/rx_slot_framer -Iapps/ft8/src/rx_result_builder \
            tests/apps/ft8_rx_probe.c \
            apps/ft8/src/rx_audio_adapter/rx_audio_adapter.c \
            apps/ft8/src/rx_frontend/rx_frontend.c \
            apps/ft8/src/rx_slot_framer/rx_slot_framer.c \
            apps/ft8/src/rx_result_builder/rx_result_builder.c \
            apps/ft8/src/ft8_engine/ft8_engine.c \
            apps/ft8/src/ft8_engine/ft8_monitor.c \
            apps/ft8/src/ft8_engine/ft8_decoder.c \
            apps/ft8/src/ft8_engine/ft8_ldpc.c \
            apps/ft8/src/ft8_engine/ft8_crc.c \
            apps/ft8/src/ft8_engine/ft8_hash_store.c \
            apps/ft8/src/ft8_engine/ft8_message_codec.c \
            apps/ft8/src/ft8_engine/vendor/kissfft/kiss_fft.c \
            apps/ft8/src/ft8_engine/vendor/kissfft/kiss_fftr.c -lm \
            -o "$B/test-apps/ft8_rx_probe.so"
          python3 - <<'PY'
          import struct, wave
          src = 'reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav'
          dst = 'rx6-root/flash/rx6.wav'
          with wave.open(src, 'rb') as w:
              assert w.getframerate() == 6000
              assert w.getnchannels() == 1
              assert w.getsampwidth() == 2
              raw = w.readframes(w.getnframes())
          samples = list(struct.unpack('<' + 'h' * (len(raw)//2), raw))
          slot_samples = 90000
          if len(samples) > slot_samples:
              raise SystemExit('golden WAV exceeds one FT8 slot')
          samples.extend([0] * (slot_samples - len(samples)))
          out = bytearray()
          for sample in samples:
              frame = struct.pack('<hh', sample, sample)
              out += frame
              out += frame
          with wave.open(dst, 'wb') as w:
              w.setnchannels(2)
              w.setsampwidth(2)
              w.setframerate(12000)
              w.writeframes(out)
          PY
          set -o pipefail
          printf 'run ft8_rx_probe /flash/rx6.wav\nexit\n' | \
            MINISHELL_APP_DIR="$PWD/$B/test-apps" \
            MINISHELL_ROOT="$PWD/rx6-root" \
            "$B/minishell" | tee "$B/rx6.log"
          grep -F 'RX6 frames=180000 slot=12345 blocks=93 messages=1 text="CQ W1XYZ FN42"' "$B/rx6.log"
          grep -F 'ft8_rx_probe: PASS' "$B/rx6.log"

      - name: Run RX-7 production decoded-UI reference
        if: steps.gate.outputs.run_reference == 'true'
        run: |
          ./build-ft8-reference/ft8_ui_smoke
          python3 tests/linux_ft8_rx7.py \
            "$PWD/build-ft8-reference/minishell" \
            "$PWD/build-ft8-reference/runtime/apps" \
            "$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
