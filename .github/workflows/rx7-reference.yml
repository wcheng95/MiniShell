name: RX-7 Reference

on:
  push:
  pull_request:

jobs:
  decoded-rx-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MiniShell
        uses: actions/checkout@v4

      - name: Checkout pinned MiniFT8-V2 reference
        uses: actions/checkout@v4
        with:
          repository: wcheng95/Mini-FT8
          ref: 5bd3ef98f72388a850bebad04bd7300b90edb63c
          path: reference/Mini-FT8

      - name: Configure
        run: cmake -S . -B build-rx7

      - name: Build MiniShell and production ft8 app
        run: cmake --build build-rx7 -j2 --target minishell ft8 ft8_ui_smoke

      - name: Run ADV UI unit proof
        run: ./build-rx7/ft8_ui_smoke

      - name: Run production RX-7 reference
        run: |
          python3 tests/linux_ft8_rx7.py \
            "$PWD/build-rx7/minishell" \
            "$PWD/build-rx7/runtime/apps" \
            "$PWD/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
