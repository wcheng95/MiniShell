name: RX-2 Reference

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-decoder:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MiniShell
        uses: actions/checkout@v4

      - name: Checkout pinned MiniFT8-V2 reference
        uses: actions/checkout@v4
        with:
          repository: wcheng95/Mini-FT8
          ref: 5bd3ef98f72388a850bebad04bd7300b90edb63c
          path: reference/Mini-FT8

      - name: Configure RX-2 host decoder
        run: cmake -S . -B build-rx2

      - name: Build RX-2 host decoder
        run: cmake --build build-rx2 -j2 --target ft8_decode

      - name: Decode pinned FT8 WAV
        shell: bash
        run: |
          WAV="${{ github.workspace }}/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
          OUTPUT="$(./build-rx2/ft8_decode "$WAV")"
          printf '%s\n' "$OUTPUT"
          test "$OUTPUT" = "CQ W1XYZ FN42"
