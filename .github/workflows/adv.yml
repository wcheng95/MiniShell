name: ADV

on:
  push:
    branches: [main]
  pull_request:

jobs:
  registry-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure static registry unit test
        run: cmake -S tests/adv_registry -B build-adv-registry
      - name: Build static registry unit test
        run: cmake --build build-adv-registry -j2
      - name: Run static registry unit test
        run: ctest --test-dir build-adv-registry --output-on-failure

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Cardputer ADV firmware and report RAM
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: platform/adv
          command: |
            idf.py build
            echo "=== ESP-IDF size summary ==="
            idf.py size
            echo "=== ELF allocated sections ==="
            xtensa-esp32s3-elf-size -A build/minishell_adv.elf

  runtime-elf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build K1 elfhello runtime application
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: platform/adv/elf_apps/elfhello
          command: |
            set -e
            idf.py elf
            test -s build/elfhello.app.elf
            echo "=== elfhello undefined imports ==="
            xtensa-esp32s3-elf-nm -u build/elfhello.app.elf
            test "$(xtensa-esp32s3-elf-nm -u build/elfhello.app.elf | awk '{print $2}' | sort -u)" = "mini_api_get"
            echo "=== elfhello ELF header ==="
            xtensa-esp32s3-elf-readelf -h build/elfhello.app.elf
