name: Linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check application dependency boundaries
        run: |
          python3 tests/app_dependency_boundary.py --self-test
          python3 tests/app_dependency_boundary.py "$PWD" ft8
          python3 tests/app_dependency_boundary.py "$PWD" keyer
      - name: Configure
        run: cmake -S . -B build-linux
      - name: Build
        run: cmake --build build-linux -j2
      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
      - name: Run AS-8 AutoSeq equivalence suite
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/auto_seq \
            tests/ft8_auto_seq_as8_test.c \
            apps/ft8/src/auto_seq/auto_seq.c \
            -o build-linux/ft8_auto_seq_as8_unit
          ./build-linux/ft8_auto_seq_as8_unit
      - name: Configure unit tests
        run: cmake -S tests/unit -B build-unit
      - name: Build unit tests
        run: cmake --build build-unit -j2
      - name: Run unit tests
        run: ctest --test-dir build-unit --output-on-failure
