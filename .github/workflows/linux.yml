name: Linux

on:
  push:
    branches: [main, linux-base, stage2-linux-services]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-linux
      - name: Build
        run: cmake --build build-linux -j2
      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
