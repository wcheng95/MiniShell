name: Linux

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-linux
      - name: Build
        run: cmake --build build-linux -j2
      - name: Test
        run: ctest --test-dir build-linux --output-on-failure
      - name: Configure unit tests
        run: cmake -S tests/unit -B build-unit
      - name: Build unit tests
        run: cmake --build build-unit -j2
      - name: Run unit tests
        run: ctest --test-dir build-unit --output-on-failure
