name: RX-4 Reference

on:
  push:
    branches: [main]
  pull_request:

jobs:
  slot-framer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MiniShell
        uses: actions/checkout@v4

      - name: Checkout pinned MiniFT8-V2 reference
        uses: actions/checkout@v4
        with:
          repository: wcheng95/Mini-FT8
          ref: 5bd3ef98f72388a850bebad04bd7300b90edb63c
          path: reference/Mini-FT8

      - name: Configure engine dependencies
        run: cmake -S . -B build-rx4

      - name: Build engine core
        run: cmake --build build-rx4 -j2 --target ft8_engine_core

      - name: Build RX-4 tests
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/rx_slot_framer \
            tests/rx_slot_framer_rx4_test.c \
            apps/ft8/src/rx_slot_framer/rx_slot_framer.c \
            -o build-rx4/rx_slot_framer_rx4_unit

          cc -std=c11 -D_POSIX_C_SOURCE=200112L \
            -Wall -Wextra -Werror -Wpedantic \
            -Iapps/ft8/src/rx_slot_framer \
            -Iapps/ft8/src/ft8_engine \
            tests/rx_slot_framer_rx4_reference.c \
            apps/ft8/src/rx_slot_framer/rx_slot_framer.c \
            build-rx4/libft8_engine_core.a \
            build-rx4/libft8_monitor_core.a \
            build-rx4/libft8_decoder_core.a \
            build-rx4/libft8_protocol_core.a \
            build-rx4/libft8_hash_store_core.a \
            -lm \
            -o build-rx4/rx_slot_framer_rx4_reference

      - name: Run RX-4 unit tests
        run: ./build-rx4/rx_slot_framer_rx4_unit

      - name: Run RX-4 framer engine golden
        run: |
          ./build-rx4/rx_slot_framer_rx4_reference \
            "${{ github.workspace }}/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav"
