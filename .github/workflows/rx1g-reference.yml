name: RX-1G Reference

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-golden:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout MiniShell
        uses: actions/checkout@v4

      - name: Checkout pinned MiniFT8-V2 reference
        uses: actions/checkout@v4
        with:
          repository: wcheng95/Mini-FT8
          ref: 5bd3ef98f72388a850bebad04bd7300b90edb63c
          path: reference/Mini-FT8

      - name: Configure RX-1G reference test
        run: >-
          cmake -S . -B build-rx1g
          -DFT8_RX1G_REFERENCE_WAV=${{ github.workspace }}/reference/Mini-FT8/tests/tx_e2e/golden/ft8_cq_w1xyz_fn42.wav

      - name: Build RX-1G engine tests
        run: cmake --build build-rx1g -j2 --target ft8_engine_rx1g_unit ft8_engine_rx1g_reference

      - name: Run RX-1G engine tests
        run: ctest --test-dir build-rx1g -R '^ft8_engine_rx1g' --output-on-failure
